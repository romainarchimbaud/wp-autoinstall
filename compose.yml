services:
  wordpress:
    build:
      context: .
      args:
        - USER_UID=${USER_UID:-1000}
        - USER_GID=${USER_GID:-1000}
        - INSTALL_NODE=${INSTALL_NODE:-false}
    volumes:
      - ./config/php.conf.ini:/usr/local/etc/php/conf.d/php.ini
      - ./wordpress:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX}
      - WORDPRESS_DB_USER=userdb
      - WORDPRESS_DB_PASSWORD=${DATABASE_PASSWORD}
      - WORDPRESS_DEBUG=${WORDPRESS_DEBUG}
      - WORDPRESS_CONFIG_EXTRA=define('WP_DEBUG_LOG', true);define('WP_DEBUG_DISPLAY', ${WORDPRESS_DEBUG_DISPLAY});
      # Saisies libres : lues par make install dans le conteneur, jamais par make
      - WP_TITLE=${WORDPRESS_WEBSITE_TITLE}
      - WP_ADMIN_USER=${WORDPRESS_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WORDPRESS_ADMIN_EMAIL}
      - WP_ADMIN_PASSWORD=${WORDPRESS_ADMIN_PASSWORD}
      # Cache WP-CLI coupé : son nettoyage aléatoire charge une lib qui affiche des « Deprecated » sous PHP 8.3
      - WP_CLI_CACHE_DIR=/dev/null
    depends_on:
      - db
    restart: always
    ports:
      - ${HTTP_PORT}:80

  db:
    image: mariadb:latest
    volumes:
      - ./db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_USER=userdb
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_DATABASE=wordpress
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - ${PHPMYADMIN_PORT}:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    depends_on:
      - db
    restart: always
